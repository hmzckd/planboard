services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: planboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planboard"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
