services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: planboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    profiles: [app]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__App: Host=postgres;Port=5432;Database=planboard;Username=planboard_app;Password=planboard_app_dev
      ConnectionStrings__Owner: Host=postgres;Port=5432;Database=planboard;Username=planboard_owner;Password=planboard_owner_dev
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
